<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SA Online Shop</title><link rel="stylesheet" href="style.css"></head><body><header><div class="top">🚚 সারা বাংলাদেশে ডেলিভারি • নিরাপদ অর্ডার</div><nav><div class="logo">SA <span>ONLINE SHOP</span></div><input id="search" placeholder="পণ্য খুঁজুন..." oninput="searchProducts()"></nav></header><section class="hero"><h1>আপনার পছন্দের পণ্য<br><span>এক জায়গায়</span></h1><p>কাপড়, ফ্যাশন ও প্রয়োজনীয় পণ্য অনলাইনে অর্ডার করুন।</p><a href="#products">শপিং শুরু করুন →</a></section><section class="cats"><button onclick="filterCat('সব')">সব</button><button onclick="filterCat('পুরুষ')">পুরুষ</button><button onclick="filterCat('নারী')">নারী</button><button onclick="filterCat('ফ্যাশন')">ফ্যাশন</button><button onclick="filterCat('অন্যান্য')">অন্যান্য</button></section><main id="products"><h2>জনপ্রিয় পণ্য</h2><div id="grid" class="grid"></div></main><div id="orderModal" class="modal"><div class="box"><button class="close" onclick="closeOrder()">×</button><h2>আপনার অর্ডার</h2><div id="selectedProduct" class="selected"></div><form onsubmit="placeOrder(event)"><input id="name" required placeholder="আপনার নাম"><input id="phone" required placeholder="মোবাইল নম্বর"><textarea id="address" required placeholder="সম্পূর্ণ ডেলিভারি ঠিকানা"></textarea><select id="payment"><option>Cash on Delivery</option><option>bKash</option><option>Nagad</option><option>কার্ড / অনলাইন পেমেন্ট</option></select><button class="checkout">অর্ডার কনফার্ম করুন</button></form><p class="note">বাস্তব bKash/Nagad/Card পেমেন্ট চালু করতে মার্চেন্ট/API সংযোগ লাগবে।</p></div></div><footer>© 2026 SA Online Shop</footer><script src="script.js"></script></body></html>
